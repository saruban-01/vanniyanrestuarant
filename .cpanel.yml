---
deployment:
  tasks:
    # Vanniyan Restaurant — Laravel deployment via cPanel Git Version Control
    # cPanel clones the repo to /home/lightupl/repositories/vanniyanrestuarant
    # and runs these tasks on every deploy/pull.

    - export REPOPATH=/home/lightupl/repositories/vanniyanrestuarant
    - export DEPLOYPATH=/home/lightupl/public_html
    - export PHP=/usr/local/bin/php
    - export COMPOSER=/usr/local/bin/composer

    # 1. Install PHP dependencies.
    #    vendor/ is gitignored, so it MUST be built on the server.
    - cd $REPOPATH && $COMPOSER install --no-dev --prefer-dist --optimize-autoloader || (cd $REPOPATH && composer install --no-dev --prefer-dist --optimize-autoloader)

    # 2. Production optimizations (safe even if .env is not present yet).
    - cd $REPOPATH && $PHP artisan config:cache || true
    - cd $REPOPATH && $PHP artisan route:cache || true

    # 3. Point the web root at Laravel's public/ folder.
    #    The rest of the repo stays OUTSIDE public_html (not web-accessible).
    - /bin/rm -rf $DEPLOYPATH
    - /bin/ln -s $REPOPATH/public $DEPLOYPATH

    # 4. Link storage (public/storage -> storage/app/public).
    - cd $REPOPATH && $PHP artisan storage:link || true
